        "title": "四、 结语：从“世界工厂”到“世界AI工厂”",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">四、 结语：从“世界工厂”到“世界AI工厂”</h3>\n<p>中国AI生态的未来，不在于单点技术的超越，而在于系统效能的极致。</p>\n<p>正如文章所言，中国正在从“强应用生态”走向“全栈生态”。在这个过程中，优米信息（UMIIS）这样的企业级平台，正是将实验室技术转化为流水线生产力的“转换器”。</p>\n<p>未来5年，当美国的模型技术遇到中国的超级应用场景，当国产算力芯片遇到优米这样的高效调度系统，中国将不仅仅是AI技术的使用者，更将成为全球AI工业化标准的定义者。</p>\n<p>UMIIS 的使命，就是让每一个大公司都拥有一个属于自己的、安全可控的、能直接创造利润的AI操作系统。 这才是生态之争的终极答案。</p>"

        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">一、核心前置逻辑：UMIIS 产品底层架构 —— 知识库是智能体唯一可信记忆底座</h3>\n<p>优米信息 UMIIS 统一智能信息系统采用三层解耦架构：底层多模态知识库中台、中层智能体可视化编排引擎、上层大模型适配网关，所有业务智能体、数字员工、编程智能体均强制绑定 RAG 检索链路，智能体所有业务输出必须依托知识库内容生成，从产品底层规避模型幻觉、答非所问、业务口径错乱问题。</p>\n<p>区别于传统文档网盘、简易在线文档库，UMIIS 知识库定位为AI 可实时读取、可治理、可权限隔离、可自动迭代的活知识资产，配套完整落地数字咨询服务，覆盖「知识盘点→数据归集→清洗结构化→向量入库→权限管控→智能体绑定→长效运营」全流程，一站式解决企业搭建知识库四大核心痛点：数据孤岛、多模态资料无法解析、知识版本混乱、无标准化 RAG 检索能力。</p>"
      },
      {
        "id": "Sheet10-sec2",
        "title": "二、第一阶段：优米数字咨询服务先行，完成知识库顶层规划（落地筹备）",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">二、第一阶段：优米数字咨询服务先行，完成知识库顶层规划（落地筹备）</h3>\n<p>企业搭建知识库最容易踩坑：盲目上传海量杂乱文档，未匹配智能体业务场景，最终检索精度极低。优米信息配套专属数字化咨询服务，先做前置梳理，避免无效投入。</p>"
      },
      {

        "icon": "fa-paragraph",

        "title": "顾问团队结合企业待落地智能体类型，划定知识库建设范围：",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">顾问团队结合企业待落地智能体类型，划定知识库建设范围：</h3>\n<p>客服 / 销售智能体：产品手册、报价单、客户 FAQ、异议话术、合同模板知识库；</p>\n<p>人事行政智能体：考勤、差旅、招聘、员工制度知识库；</p>\n<p>研发编程智能体：代码规范、架构文档、测试用例、故障复盘知识库；</p>\n<p>风控 / 财务智能体：报销规范、风控条款、审计标准知识库。</p>"

        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">根据企业数据合规要求二选一：</h3>\n<p>私有化部署：涉密制造、金融、政务，UMIIS 本地部署向量库，数据不出企业内网；</p>\n<p>混合云 SaaS：中小企业通用场景，云端平台 + 本地敏感文件隔离存储；</p>\n<p>同步规划分级权限体系，提前划定高管 / 部门负责人 / 普通员工 / 外部客户四类访问边界。</p>"
      },
      {
        "id": "Sheet10-sec8",
        "title": "三、第二阶段：UMIIS 产品落地 —— 多源知识全渠道归集，打通数据孤岛",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">三、第二阶段：UMIIS 产品落地 —— 多源知识全渠道归集，打通数据孤岛</h3>\n<p>依托 UMIIS 知识库中台的全渠道接入引擎，搭配优米实施工程师落地服务，一次性归集分散在各个系统的企业知识，解决传统方案只能单文件上传的短板。</p>"
      },
      {
        "id": "Sheet10-sec9",
        "title": "（一）系统自动化对接（API / 无侵入同步）",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">（一）系统自动化对接（API / 无侵入同步）</h3>\n<p>业务系统打通：一键对接 OA、CRM、项目管理、ERP、Git 代码仓库，配置定时自动同步规则，新增制度、产品资料、代码文档自动拉取入库，无需人工重复上传；</p>\n<p>本地存储批量同步：企业服务器、共享网盘设置同步目录，UMIIS 后台自动监测文件新增、修改、删除，增量更新知识库。</p>"
      },

      },
      {
        "id": "Sheet10-sec11",
        "title": "支持市面上全部企业知识载体，内置解析组件无需额外采购 OCR、语音转写工具：",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">支持市面上全部企业知识载体，内置解析组件无需额外采购 OCR、语音转写工具：</h3>\n<p>文本类：Word、PDF、Excel、PPT、Markdown 合同、需求文档；</p>\n<p>图文扫描类：扫描件图纸、设备结构图、手写审批单，OCR 自动提取文字、图表；</p>\n<p>音视频类：售后通话录音、内部培训视频，语音转文字 + 自动抽取知识点分段入库；</p>\n<p>代码类：前端 / 后端代码、接口文档、SQL 脚本，自动识别注释与业务逻辑。</p>"
      },
      {
        "id": "Sheet10-sec12",

        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">（三）批量上传辅助服务</h3>\n<p>针对线下纸质档案、老旧离线资料，优米配套数字化加工增值服务：纸质文档扫描、音频转写、图纸文字提取，批量标准化后导入 UMIIS 平台，补齐企业隐性沉睡知识。</p>"
      },
      {
        "id": "Sheet10-sec13",
        "title": "四、第三阶段：UMIIS 核心知识治理能力 —— 清洗、结构化、版本管控（决定知识库质量的关键环节）",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">四、第三阶段：UMIIS 核心知识治理能力 —— 清洗、结构化、版本管控（决定知识库质量的关键环节）</h3>\n<p>单纯归集文档只是文件仓库，经过 UMIIS 智能化治理后才能成为适配智能体的可用知识库，平台自动化完成 80% 治理工作，辅以人工审核服务，解决版本冲突、重复冗余、信息过期问题。</p>"
      },
      {
        "id": "Sheet10-sec14",
        "title": "1. 自动清洗降噪",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">1. 自动清洗降噪</h3>\n<p>文档去重：比对全文语义，重复报价、制度自动合并，保留最新版本；</p>\n<p>无效内容过滤：空白页、水印、广告、无关批注自动剔除；</p>\n<p>内容校验：识别残缺、乱码、未定稿文档，标记待人工复核。</p>"
      },
      {
        "id": "Sheet10-sec15",
        "title": "2. 语义分层切片（适配 RAG 检索核心技术）",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">2. 语义分层切片（适配 RAG 检索核心技术）</h3>\n<p>区别于固定字数粗暴分割，UMIIS 采用语义分块策略，自动识别章节、段落、条款边界，保证每一段 Chunk 语义完整：</p>\n<p>合同、制度：按条款、章节切片；</p>\n<p>产品手册：按功能、故障、维修步骤拆分；</p>\n<p>代码 / 技术文档：按模块、接口、报错案例拆分；</p>\n<p>切片完成后自动附加元数据标签：更新时间、所属业务、版本号、作者、涉密等级。</p>"
      },
      {
        "id": "Sheet10-sec16",
        "title": "3. 全生命周期版本时效管理（杜绝智能体调取过期知识）",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">3. 全生命周期版本时效管理（杜绝智能体调取过期知识）</h3>\n<p>版本归档机制：文档更新自动留存历史版本，新旧文档做冲突标记；</p>\n<p>时效自动下架：可设置制度、报价单有效期，到期自动隐藏旧内容，智能体仅检索现行有效资料；</p>\n<p>变更追溯日志：每一份文档上传、修改、下架全留痕，满足审计、合规核查要求。</p>"
      },

        "icon": "fa-paragraph",

        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">自动生成语义标签 + 人工业务标签双维度标注：</h3>\n<p>系统自动标签：文档类型、发布时间、关键词、实体名称（产品名、客户名称）；</p>\n<p>人工业务标签：业务场景、部门、权限等级、关联智能体（销售智能体 / 售后智能体）。</p>"
      },
      {
        "id": "Sheet10-sec19",
        "title": "五、第四阶段：向量化入库，搭建企业专属混合检索引擎（智能体调取知识底层）",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">五、第四阶段：向量化入库，搭建企业专属混合检索引擎（智能体调取知识底层）</h3>\n<p>UMIIS 内置企业级向量数据库与 Embedding 嵌入模型，配套标准化 RAG 技术实施服务，完成知识从 “文档” 到 “AI 可检索向量” 的转化，也是知识库支撑智能体的核心技术链路。</p>"
      },
      {

      {

      },
      {
        "id": "Sheet10-sec23",
        "title": "区别于单一向量检索召回不准的行业通病，UMIIS 原生搭载混合检索策略：",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">区别于单一向量检索召回不准的行业通病，UMIIS 原生搭载混合检索策略：</h3>\n<p>向量检索：匹配语义相似内容，适配模糊提问（如 “机床异响怎么修”）；</p>\n<p>BM25 关键词检索：精准匹配产品型号、制度编号、专业术语；</p>\n<p>AI 重排序：自动筛选相关性 Top-K 片段，过滤无关内容，大幅提升智能体回答精准度。</p>"
      },

      },
      {
        "id": "Sheet10-sec25",
        "title": "在 UMIIS 后台创建独立知识空间，不同智能体绑定专属知识库，数据物理隔离：",
        "icon": "fa-paragraph",
        "badge": "",
        "content": "<h3 style=\"color:var(--color-primary);font-size:1rem;margin:0.8rem 0 0.3rem;padding-bottom:0.3rem;border-bottom:1px solid var(--color-neutral-200);\">在 UMIIS 后台创建独立知识空间，不同智能体绑定专属知识库，数据物理隔离：</h3>\n<p>销售智能体知识库：仅存放产品、报价、销售话术；</p>\n<p>售后智能体知识库：设备故障、维修手册；</p>\n<p>财务智能体知识库：报销、风控条款；</p>\n<p>避免跨领域知识混淆，智能体不会调取无关业务内容。</p>"
      },
      {
        "id": "Sheet10-sec26",
        "title": "六、第五阶段：细粒度权限管控，解决知识库合规泄密风险（UMIIS 差异化能力）",

// Build top navigation
function buildTopNav() {
  const nav = document.getElementById("topNav");
  const keys = Object.keys(pages);
  nav.innerHTML = keys.map(k => {
    const p = pages[k];
    return `<li><a href="#" data-page="${k}" onclick="switchPage('${k}'); return false;" title="${p.title}"><i class="fas ${p.icon}"></i> ${p.title}</a></li>`;
  }).join("");
}

// Build sidebar navigation for current page
function buildSidebar(pageKey) {
  const nav = document.getElementById("sidebarNav");
  const page = pages[pageKey];
  if (!page) return;
  const items = page.sections.map((s, i) => {
    const title = s.title || `板块 ${i+1}`;
    const icon = s.icon || "fa-paragraph";
    return `<li><a href="#${s.id}" data-section="${s.id}"><i class="fas ${icon}"></i> ${title}</a></li>`;
  });
  nav.innerHTML = `<ul>${items.join("")}</ul>`;
}

// Build main content for current page
function buildContent(pageKey) {
  const main = document.getElementById("mainContent");
  const page = pages[pageKey];
  if (!page) { main.innerHTML = "<p>内容加载中...</p>"; return; }
  
  let html = `<div class="page-header">
    <h1><i class="fas ${page.icon}"></i> ${page.title}</h1>
  </div>`;
  
  page.sections.forEach((sec, idx) => {
    const content = sec.content || "";
    if (idx === 0) {
      html += `<div class="card banner-card" id="${sec.id}">
        <div class="card-body">${content}</div>
      </div>`;
    } else {
      html += `<div class="card" id="${sec.id}">
        <div class="card-body">${content}</div>
      </div>`;
    }
  });
  
  main.innerHTML = html;
  observeSections();
}

// Switch page
function switchPage(pageKey) {
  document.querySelectorAll(".top-nav .nav-links a").forEach(a => {
    a.classList.toggle("active", a.dataset.page === pageKey);
  });
  buildSidebar(pageKey);
  buildContent(pageKey);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Intersection Observer for sidebar active state
function observeSections() {
  const sections = document.querySelectorAll(".card[id]");
  const navLinks = document.querySelectorAll(".sidebar nav a[data-section]");
  if (sections.length === 0) return;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        navLinks.forEach(link => {
          link.classList.toggle("active", link.dataset.section === id);
        });
      }
    });
  }, { rootMargin: "-20% 0px -60% 0px" });
  sections.forEach(s => observer.observe(s));
}

// Scroll to top button
window.addEventListener("scroll", () => {
  const btn = document.getElementById("scrollTopBtn");
  btn.classList.toggle("show", window.scrollY > 400);
});

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Init
buildTopNav();
const firstKey = Object.keys(pages)[0];
switchPage(firstKey);
</script>
